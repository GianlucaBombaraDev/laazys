name: Feature request
description: Suggest an idea or an improvement
labels: [enhancement]
body:
    - type: textarea
      id: problem
      attributes:
          label: What problem would this solve?
      validations:
          required: true
    - type: textarea
      id: proposal
      attributes:
          label: Proposed solution
          description: If it's about a new JSDoc tag, include an example of how you'd write it.
