name: Build and Deploy

on:
  release:
    types: [created]

jobs:
    build-deploy:
        runs-on: ubuntu-latest
        permissions:
          contents: read
          packages: write

        steps:
            - uses: actions/checkout@v7
              with:
                  # Fetches all history for all tags and branches
                  fetch-depth: 0

            # Uses the version pinned in the root package.json "packageManager" field
            - name: Install PNPM
              uses: pnpm/action-setup@v6

            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: 24
                  registry-url: https://npm.pkg.github.com
                  cache: pnpm

            - name: Install Dependencies
              run: pnpm install --frozen-lockfile

            - name: Build Laazys App
              run: pnpm run build
              working-directory: ./packages/laazys-app

            - name: Build Laazys
              run: pnpm run build
              working-directory: ./packages/laazys

            - name: Publish to GitHub Packages
              run: pnpm publish --filter ./packages/laazys --registry=https://npm.pkg.github.com --no-git-checks
              env:
                NODE_AUTH_TOKEN: ${{secrets.GITHUB_TOKEN}}
